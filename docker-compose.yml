version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: budget_postgres
    environment:
      POSTGRES_USER: litellm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U litellm_user -d litellm_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: budget_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes" ]

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: budget_litellm
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://litellm_user:${POSTGRES_PASSWORD}@postgres:5432/litellm_db"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./config.yaml:/app/config.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command:
      - "--config"
      - "/app/config.yaml"

volumes:
  postgres_data:
  redis_data:
